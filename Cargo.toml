[package]
name = "ai-comms-cli"
version = "0.1.0"
edition = "2021"
description = "An OpenAI-compatible CLI frontend for any LLM provider"

[[bin]]
name = "comms"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
rustyline = "13.0"
home = "0.5"
anyhow = "1.0"
thiserror = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1.10", features = ["v4"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
aes-gcm = "0.10"
base64 = "0.22"
textwrap = { version = "0.16", features = ["terminal_size"] }
futures-util = "0.3"
async-stream = "0.3"
# `crossterm_0_29` keeps ratatui's vendored backend on the same crossterm
# version we depend on directly for its async EventStream.
# `unstable-rendered-line-info` exposes Paragraph::line_count, the only way to
# measure wrapped height with ratatui's own wrapper. Estimating it separately
# drifts from the real layout and scrolls the transcript off its own content.
ratatui = { version = "0.30.2", features = [
    "crossterm_0_29",
    "unstable-rendered-line-info",
] }
crossterm = { version = "0.29", features = ["event-stream"] }
tui-markdown = "0.3.9"

[profile.release]
opt-level = 3
lto = true
