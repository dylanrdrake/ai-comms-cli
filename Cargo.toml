[package]
name = "orca-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "orca"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
rustyline = "13.0"
home = "0.5"
anyhow = "1.0"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
